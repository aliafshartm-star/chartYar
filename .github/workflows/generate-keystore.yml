name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore chartyar-release.jks \
            -alias chartyar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ChartYar2026SecureKey \
            -keypass ChartYar2026SecureKey \
            -dname "CN=ChartYar, OU=App, O=ChartYar, L=Tehran, ST=Tehran, C=IR"

      - name: Convert to Base64
        run: |
          base64 chartyar-release.jks > chartyar-release-base64.txt
          echo "=== BASE64 CONTENT START ==="
          cat chartyar-release-base64.txt
          echo "=== BASE64 CONTENT END ==="

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: chartyar-release.jks

      - name: Upload Base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: chartyar-release-base64.txt