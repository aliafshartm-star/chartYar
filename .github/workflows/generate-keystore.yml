name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore chartyar-release.jks \
            -alias chartyar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ChartyarKey2025 \
            -keypass ChartyarKey2025 \
            -dname "CN=ChartYar, OU=Mobile, O=ChartYar, L=Tehran, S=Tehran, C=IR"

      - name: Show Base64
        run: |
          echo "========== COPY FROM HERE =========="
          base64 -w 0 chartyar-release.jks
          echo ""
          echo "========== COPY TO HERE =========="
          echo ""
          echo "PASSWORD:     ChartyarKey2025"
          echo "ALIAS:        chartyar"
          echo "KEY_PASSWORD: ChartyarKey2025"

      - name: Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: chartyar-release.jks
          retention-days: 1