name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore chartyar-release.jks \
            -alias chartyar \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass tmbax525@&@&tmbaX!?afshar525$&@ \
            -keypass tmbax525@&@&tmbaX!?afshar525$&@ \
            -dname "CN=ChartYar, OU=App, O=ChartYar, L=Tehran, ST=Tehran, C=IR"

      - name: Convert to Base64
        run: |
          base64 -w 0 chartyar-release.jks > chartyar-base64.txt
          echo "=== BASE64 START ==="
          cat chartyar-base64.txt
          echo ""
          echo "=== BASE64 END ==="

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: chartyar-keystore
          path: chartyar-release.jks
          retention-days: 1

      - name: Upload Base64
        uses: actions/upload-artifact@v4
        with:
          name: chartyar-base64
          path: chartyar-base64.txt
          retention-days: 1